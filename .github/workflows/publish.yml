name: Publish to Maven Central
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Uses the version pinned in gradle/wrapper/gradle-wrapper.properties.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The AAR ships libunilitix-native.so (native crash capture, API 21-29).
      # Install the exact NDK build.gradle.kts pins (ndkVersion) and the CMake
      # AGP uses by default, instead of relying on what the runner image has.
      - name: Install NDK and CMake
        run: |
          NDK=$(grep -E '^\s*ndkVersion = ' unilitix-sdk/build.gradle.kts | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          test -n "$NDK" || { echo "ndkVersion not found in unilitix-sdk/build.gradle.kts"; exit 1; }
          echo "NDK $NDK"
          # sdkmanager downloads sometimes fail with "Archive is not a ZIP
          # archive" (a truncated download): retry, clearing the partial install.
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3 4; do
            # `yes` dies of SIGPIPE when sdkmanager exits, so the pipeline's
            # status is not trusted (pipefail): the installed files are checked.
            yes | "$SDKMANAGER" --install "ndk;$NDK" "cmake;3.22.1" > /dev/null || true
            if [ -f "$ANDROID_HOME/ndk/$NDK/source.properties" ] && [ -d "$ANDROID_HOME/cmake/3.22.1" ]; then break; fi
            echo "sdkmanager attempt $attempt failed; retrying"
            rm -rf "$ANDROID_HOME/ndk/$NDK" "$ANDROID_HOME/.temp" "$ANDROID_HOME/temp"
            sleep $((attempt * 15))
          done
          test -f "$ANDROID_HOME/ndk/$NDK/source.properties" || { echo "NDK $NDK not installed after retries"; exit 1; }

      - name: Tag matches the library version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          LIB=$(grep -E '^unilitix\.version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          test -n "$LIB" || { echo "unilitix.version not found in gradle.properties"; exit 1; }
          test "$TAG" = "$LIB" || { echo "tag $TAG != gradle.properties unilitix.version $LIB"; exit 1; }

      # Nothing is published unless tests and lint pass on the tagged commit.
      - name: Unit tests, lint and release build
        run: ./gradlew :unilitix-sdk:testDebugUnitTest :unilitix-sdk:lintDebug :unilitix-sdk:assembleRelease

      - name: AAR contains the native library for every ABI
        run: |
          AAR=unilitix-sdk/build/outputs/aar/unilitix-sdk-release.aar
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            unzip -l "$AAR" | grep -q "jni/$abi/libunilitix-native.so" || { echo "missing $abi .so in $AAR"; exit 1; }
          done

      - name: Publish to Maven Central
        run: ./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
