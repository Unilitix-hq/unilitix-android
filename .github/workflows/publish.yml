name: Publish to Maven Central
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      # The AAR ships libunilitix-native.so (native crash capture, API 21-29).
      # Install the exact NDK build.gradle.kts pins (ndkVersion) and the CMake
      # AGP uses by default, instead of relying on what the runner image has.
      - name: Install NDK and CMake
        run: |
          NDK=$(grep -E '^\s*ndkVersion = ' unilitix-sdk/build.gradle.kts | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          test -n "$NDK" || { echo "ndkVersion not found in unilitix-sdk/build.gradle.kts"; exit 1; }
          echo "NDK $NDK"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK" "cmake;3.22.1" > /dev/null

      - name: Tag matches the library version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          LIB=$(grep -E 'version = "' unilitix-sdk/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          test "$TAG" = "$LIB" || { echo "tag $TAG != build.gradle.kts $LIB"; exit 1; }

      - name: Unit tests and release build
        run: ./gradlew :unilitix-sdk:testDebugUnitTest :unilitix-sdk:assembleRelease

      - name: AAR contains the native library for every ABI
        run: |
          AAR=unilitix-sdk/build/outputs/aar/unilitix-sdk-release.aar
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            unzip -l "$AAR" | grep -q "jni/$abi/libunilitix-native.so" || { echo "missing $abi .so in $AAR"; exit 1; }
          done

      - name: Publish to Maven Central
        run: ./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
